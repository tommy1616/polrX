<div class="modal fade" id="edit-long-link-{{ linkEnding }}" tabindex="-1" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <h4 class="modal-title">{{ modalI18n.long_url_title || 'Long URL' }}</h4>
            </div>
            <div class="modal-body">
                <input type="url" value="{{ oldLongLink }}" placeholder="https://..." class="form-control" />
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-dismiss="modal" ng-click="saveChanges()">{{ modalI18n.save_changes || 'Save Changes' }}</button>
            </div>
        </div>
    </div>
</div>
